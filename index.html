<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>📚 도서관 대시보드</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도서관">
<style>
  /* 기준: html 폰트 14.5px = 1rem. 모든 크기를 rem 으로 두어 글씨 크기 조절(가- / 가+)이 전체에 함께 적용된다.
     디자인: 라이트 톤 기본(민트 포인트) · 다크 모드 토글 지원. */
  html{
    --z:1;                        /* 넓게 잡힌 뷰포트 보정 배율 (JS가 채움) */
    --fs:14.5px;                  /* 기본 글씨 (모바일) */
    --tabh:3.6rem;                /* 탭 바 높이 (JS가 실측해 갱신) */
    font-size:calc(var(--fs) * var(--z));
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  html[data-fs="1"]{--fs:15.6px}
  html[data-fs="2"]{--fs:16.8px}
  html[data-fs="3"]{--fs:18px}

  :root{
    /* 표면 */
    --bg:#f4f6f9; --bg2:#eceff5; --card:#ffffff; --card2:#f4f6f9;
    --line:#eef1f5; --line2:#e3e8ef;
    /* 글자 */
    --fg:#0f172a; --muted:#5b6472; --muted2:#9aa3ad;
    /* 포인트 */
    --accent:#059669; --accent-ink:#ffffff;
    --mint:#10b981; --mintd:#059669; --mintl:#e9f9f2; --ringbg:#eef1f5;
    --good:#10b981; --warn:#f59e0b; --bad:#ef4444; --purple:#8b5cf6;
    --sn:#10b981; --hn:#0ea5e9; --ra:#8b5cf6;
    --sh:0 2px 12px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
    --shmint:0 10px 22px rgba(16,185,129,.14);
    --r:1.25rem;
    /* 배너 */
    --bn1:#eafaf3; --bn2:#d4f4e7; --bn3:#eefaf6;
    --bnInk:#063c2d; --bnSub:#2d6b56; --bnAcc:#059669;
    --bnPill:rgba(255,255,255,.78); --bnLine:rgba(16,185,129,.2);
    /* 칩 · 뱃지 */
    --chipFullBg:#fff1e6; --chipFullFg:#b45309;
    --chipOkBg:#eaf9f2; --chipOkFg:#047857;
    --chipInfoBg:#eef2ff; --chipInfoFg:#3730a3;
    --tagRedBg:#fee2e2; --tagRedFg:#b91c1c;
    --tagMintBg:#dcfce7; --tagMintFg:#047857;
    --tagAmberBg:#fef3c7; --tagAmberFg:#92400e;
    --hotBg:#ffe4e8; --hotFg:#c2233d;
    --warnBg:#fff2da; --warnFg:#a15b06;
    --okBg:#def7e7; --okFg:#127c43;
    --d1Bg:#fee2e2; --d1Fg:#b91c1c;
    --d2Bg:#ffedd5; --d2Fg:#c2410c;
    --d3Bg:#fef3c7; --d3Fg:#92400e;
    --dnBg:#eef2ff; --dnFg:#3730a3;
    --pillBg:#f4f6f9; --pillFg:#5b6472;
    --codeBg:#f4f6f9;
    --toastBg:#111827; --toastFg:#ffffff; --toastLine:#111827;
  }
  html[data-theme="dark"]{
    --bg:#0e1116; --bg2:#0a0c10; --card:#161a21; --card2:#1c212a;
    --line:#252b36; --line2:#2c3442;
    --fg:#e9edf4; --muted:#98a3b4; --muted2:#6f7b8d;
    --accent:#34d399; --accent-ink:#062b1f;
    --mint:#34d399; --mintd:#10b981; --mintl:#12231c; --ringbg:#252b36;
    --good:#4ade80; --warn:#fbbf24; --bad:#fb7185; --purple:#b39dff;
    --sn:#4ade80; --hn:#38bdf8; --ra:#b39dff;
    --sh:0 1px 0 rgba(255,255,255,.03) inset;
    --shmint:0 10px 22px rgba(0,0,0,.35);
    --bn1:#12241d; --bn2:#0f3025; --bn3:#122820;
    --bnInk:#d7f7ea; --bnSub:#8fd6bb; --bnAcc:#34d399;
    --bnPill:rgba(255,255,255,.09); --bnLine:rgba(52,211,153,.22);
    --chipFullBg:#3a2b10; --chipFullFg:#ffc861;
    --chipOkBg:#14261c; --chipOkFg:#75dda4;
    --chipInfoBg:#20253c; --chipInfoFg:#b9c4ff;
    --tagRedBg:#3d1522; --tagRedFg:#ff9db0;
    --tagMintBg:#14261c; --tagMintFg:#75dda4;
    --tagAmberBg:#3a2b10; --tagAmberFg:#ffc861;
    --hotBg:#3d1522; --hotFg:#ff90a5;
    --warnBg:#3a2b10; --warnFg:#ffc861;
    --okBg:#14261c; --okFg:#75dda4;
    --d1Bg:#3d1522; --d1Fg:#ff9db0;
    --d2Bg:#3a2413; --d2Fg:#ffb27a;
    --d3Bg:#3a2b10; --d3Fg:#ffc861;
    --dnBg:#1e2438; --dnFg:#a9b6ff;
    --pillBg:#1c212a; --pillFg:#98a3b4;
    --codeBg:#1c212a;
    --toastBg:#26303f; --toastFg:#ffffff; --toastLine:#33405a;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); font-size:1rem; line-height:1.5; letter-spacing:-.01em;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    padding-bottom:calc(4.6rem + env(safe-area-inset-bottom));
  }
  .wrap{max-width:calc(540px * var(--z));margin:0 auto;padding:0 0.85rem}

  /* ---------------- 헤더 ---------------- */
  header.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    gap:0.35rem 0.4rem;padding:0.9rem 0 0.55rem}
  .brand{display:flex;align-items:center;gap:0.6rem;min-width:0}
  .logo{flex:0 0 auto;width:2.55rem;height:2.55rem;border-radius:0.8rem;background:var(--card);
    box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
  .btxt{min-width:0}
  .eyebrow{font-size:0.76rem;font-weight:700;color:var(--muted2);letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1{margin:0.05rem 0 0;font-size:1.3rem;line-height:1.22;letter-spacing:-.03em;font-weight:900;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hctl{display:flex;gap:0.22rem;flex:0 0 auto}
  .cbtn{width:1.95rem;height:1.95rem;padding:0;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:0.78rem;font-weight:800;font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
    box-shadow:var(--sh)}
  .cbtn.theme{font-size:0.85rem}
  .cbtn:active{transform:scale(.94)}
  .cbtn:disabled{opacity:.4}
  .sub{grid-column:1/-1;font-size:0.72rem;font-weight:700;color:var(--muted2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asofrow{grid-column:1/-1;display:flex;align-items:center;gap:0.32rem;flex-wrap:nowrap;min-width:0}
  .asof{display:inline-block;font-size:0.74rem;font-weight:700;color:var(--muted);
    border:1px solid var(--line);background:var(--card);padding:0.2rem 0.5rem;border-radius:999px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asof b{color:var(--accent);font-weight:800}
  .hd-date{margin-left:auto;font-size:0.76rem;font-weight:900;color:var(--muted);
    background:var(--card);box-shadow:var(--sh);padding:0.28rem 0.6rem;border-radius:999px;white-space:nowrap}
  .rbtn{display:inline-flex;align-items:center;justify-content:center;gap:0.2rem;min-height:1.9rem;
    padding:0.18rem 0.55rem;border-radius:999px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);font-size:0.74rem;font-weight:800;font-family:inherit;cursor:pointer;line-height:1.2;
    white-space:nowrap;flex:0 0 auto;box-shadow:var(--sh)}
  .rbtn:active{transform:scale(.97)}
  .rbtn.on{border-color:var(--accent);color:var(--accent)}

  /* ---------------- 오늘 꼭 챙길 일 (민트 배너) ---------------- */
  #kpi{display:none}
  html[data-tab="todo"] #kpi{display:block}
  .banner{position:relative;overflow:hidden;border-radius:1.4rem;padding:0.95rem 1rem 0.9rem;margin:0.15rem 0 0.35rem;
    background:linear-gradient(135deg,var(--bn1) 0%,var(--bn2) 52%,var(--bn3) 100%);
    box-shadow:var(--shmint)}
  .banner:after{content:"";position:absolute;right:-2.6rem;top:-3.2rem;width:9.4rem;height:9.4rem;border-radius:50%;
    background:radial-gradient(circle,rgba(16,185,129,.18),rgba(16,185,129,0) 70%);pointer-events:none}
  .bn-top{display:flex;align-items:center;justify-content:space-between;position:relative;gap:0.5rem}
  .bn-badge{font-size:0.8rem;font-weight:900;color:var(--bnAcc);background:var(--bnPill);
    padding:0.28rem 0.62rem;border-radius:999px}
  .bn-more{font-family:inherit;font-size:0.8rem;font-weight:800;color:var(--bnAcc);cursor:pointer;white-space:nowrap;
    background:none;border:0;padding:0.1rem 0.15rem}
  .bn-main{display:flex;align-items:flex-end;justify-content:space-between;gap:0.6rem;margin-top:0.55rem;position:relative}
  .bn-title{font-size:1.28rem;font-weight:900;line-height:1.32;color:var(--bnInk);letter-spacing:-.04em}
  .bn-title b{font-size:1.42rem}
  .bn-sub{margin-top:0.3rem;font-size:0.86rem;font-weight:700;color:var(--bnSub);line-height:1.4}
  .bn-sub b{color:var(--bnAcc)}
  .bn-num{display:flex;flex-direction:column;align-items:flex-end;align-self:center;line-height:1;flex:0 0 auto;
    background:none;border:0;padding:0;font-family:inherit;cursor:pointer;border-radius:0.8rem}
  .bn-num:active{transform:scale(.96)}
  .bn-num b{font-size:3.1rem;font-weight:900;letter-spacing:-.16rem;color:var(--bnAcc)}
  .bn-num b span{font-size:0.95rem;font-weight:800;letter-spacing:0;margin-left:0.4rem}
  .bn-num em{font-style:normal;font-size:0.72rem;font-weight:800;color:var(--bnSub);margin-top:0.2rem}
  .bn-pills{display:flex;gap:0.35rem;margin-top:0.7rem;flex-wrap:wrap;position:relative}
  .bp{font-family:inherit;font-size:0.78rem;font-weight:800;color:var(--bnSub);background:var(--bnPill);
    border:1px solid var(--bnLine);padding:0.24rem 0.6rem;border-radius:999px;white-space:nowrap;
    cursor:pointer;line-height:1.35}
  .bp:active{transform:scale(.96)}
  .bp.warn{color:var(--warnFg);background:var(--warnBg);border-color:var(--warnBg)}
  .bp.hot{color:var(--hotFg);background:var(--hotBg);border-color:var(--hotBg)}

  /* ---------------- 섹션 머리 ---------------- */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:0.4rem;
    margin:1.35rem 0 0.55rem;padding:0 0.1rem;font-size:1.14rem;font-weight:900;letter-spacing:-.03em;color:var(--fg)}
  .sec:first-child{margin-top:0.5rem}
  .sec h2{margin:0;font-size:1.14rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:0.35rem;min-width:0}
  .sec .n{font-size:0.78rem;font-weight:800;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);border-radius:999px;padding:0.04rem 0.38rem;letter-spacing:0}
  .sec .hint{font-weight:700;font-size:0.78rem;color:var(--muted2);letter-spacing:0;white-space:nowrap}
  .sub-h{font-size:0.86rem;font-weight:900;color:var(--muted);margin:0.9rem 0.1rem 0.1rem;display:flex;gap:0.35rem;align-items:center}
  .sub-h em{font-style:normal;color:var(--muted2);font-weight:700;font-size:0.78rem}

  /* ---------------- [도서관별 | 사람별] 토글 ---------------- */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:0.22rem;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:0.22rem;margin:0 0 0.55rem;box-shadow:var(--sh)}
  .sg{min-height:2.35rem;border:0;border-radius:999px;background:transparent;color:var(--muted);
    font-family:inherit;font-size:0.92rem;font-weight:900;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:0.3rem;letter-spacing:-.01em}
  .sg.on{background:var(--fg);color:var(--bg);box-shadow:0 2px 8px rgba(16,24,40,.16)}
  .sg .ic{font-size:0.95rem}

  /* ---------------- 요약 링 카드 ---------------- */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.95rem}
  .summary{display:flex;align-items:center;gap:0.75rem;padding:0.85rem 0.85rem}
  .ring-wrap{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:0.16rem;
    background:none;border:0;padding:0;font-family:inherit;color:inherit;cursor:pointer;border-radius:0.9rem}
  .ring-wrap:active{transform:scale(.96)}
  .ring{display:block;width:96px;height:96px}
  .ring-cap{font-size:0.74rem;font-weight:900;color:var(--mintd);background:var(--mintl);
    padding:0.1rem 0.42rem;border-radius:999px;white-space:nowrap;letter-spacing:-.01em}
  .sum-row{display:flex;gap:0.7rem;flex-wrap:wrap}
  .sum-k{display:flex;flex-direction:column;min-width:0;background:none;border:0;padding:0.1rem 0.15rem;
    font-family:inherit;color:inherit;cursor:pointer;border-radius:0.5rem;text-align:left}
  .sum-k:active{background:var(--card2)}
  .sum-k b{font-size:1.24rem;font-weight:900;letter-spacing:-.04em;line-height:1.15}
  .sum-k span{font-size:0.72rem;font-weight:800;color:var(--muted2);margin-top:0.02rem}
  .sum-l{font-size:0.78rem;font-weight:700;color:var(--muted);margin-top:0.2rem;line-height:1.45}
  .sum-chips{display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap}
  .sumchip{font-family:inherit;font-size:0.75rem;font-weight:800;color:var(--muted);background:var(--card2);
    border:0;padding:0.26rem 0.5rem;border-radius:0.5rem;cursor:pointer}
  .sumchip.hot{color:var(--warnFg);background:var(--warnBg)}
  .sumchip:active{transform:scale(.96)}

  /* ---------------- 도서관별 · 사람별 카드 ---------------- */
  .libcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.85rem 0.95rem 0.8rem;margin-top:0.6rem;
    cursor:pointer;transition:transform .12s ease}
  .libcard:active{transform:scale(.985)}
  .goarrow{font-size:0.95rem;font-weight:900;color:var(--muted2);margin-left:0.1rem}
  .lib-h{display:flex;align-items:center;justify-content:space-between;gap:0.4rem;margin-bottom:0.5rem;flex-wrap:wrap}
  .lib-name{font-size:1.06rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:0.4rem;min-width:0}
  .dotlib{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--sn);flex:0 0 auto;display:inline-block}
  .dotlib.hn{background:var(--hn)} .dotlib.ra{background:var(--ra)}
  .chip{font-size:0.76rem;font-weight:900;padding:0.22rem 0.52rem;border-radius:999px;white-space:nowrap}
  .chip.full{background:var(--chipFullBg);color:var(--chipFullFg)}
  .chip.ok{background:var(--chipOkBg);color:var(--chipOkFg)}
  .chip.info{background:var(--chipInfoBg);color:var(--chipInfoFg)}
  .metric{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;align-items:center;gap:0.55rem;margin-top:0.42rem}
  .metric .k{font-size:0.86rem;font-weight:800;color:var(--muted);white-space:nowrap}
  .bar{height:0.55rem;border-radius:999px;background:var(--ringbg);overflow:hidden;display:flex}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,var(--mint))}
  .bar i.full{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .bar i.none{background:var(--line2)}
  .bar i.unk{background:repeating-linear-gradient(45deg,#a7f3d0,#a7f3d0 6px,#dcfce7 6px,#dcfce7 12px)}
  html[data-theme="dark"] .bar i.unk{background:repeating-linear-gradient(45deg,#14532d,#14532d 6px,#0f3d24 6px,#0f3d24 12px)}
  /* 비치중 — 도서관 점 색과 같은 빗금 바 (한도가 아니라 서가에 있는 권수) */
  .bar i.avail{background:repeating-linear-gradient(45deg,var(--av1),var(--av1) 5px,var(--av2) 5px,var(--av2) 10px)}
  .bar i.avail.lib-sn{--av1:#10b981;--av2:#d1fae5}
  .bar i.avail.lib-hn{--av1:#0ea5e9;--av2:#e0f2fe}
  .bar i.avail.lib-ra{--av1:#8b5cf6;--av2:#ede9fe}
  html[data-theme="dark"] .bar i.avail.lib-sn{--av1:#10b981;--av2:#0c3b2c}
  html[data-theme="dark"] .bar i.avail.lib-hn{--av1:#38bdf8;--av2:#0c3a52}
  html[data-theme="dark"] .bar i.avail.lib-ra{--av1:#a78bfa;--av2:#2e2350}
  .metric.availrow{width:100%;background:none;border:0;padding:0.12rem 0;margin-top:0.42rem;
    font-family:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:0.5rem}
  .metric.availrow:active{background:var(--card2)}
  .metric .arr{font-size:0.95rem;font-weight:900;color:var(--muted2);margin-left:0.1rem;line-height:1}
  .metric .v{font-size:0.8rem;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .metric .v b{font-size:0.98rem;font-weight:900;color:var(--fg)}

  .pcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.85rem 0.95rem 0.75rem;margin-top:0.6rem;
    cursor:pointer;transition:transform .12s ease}
  .pcard:active{transform:scale(.985)}
  .p-head{display:flex;align-items:center;justify-content:space-between;gap:0.4rem;flex-wrap:wrap;
    padding-bottom:0.5rem;border-bottom:1px solid var(--line)}
  .p-name{font-size:1.08rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:0.4rem}
  .p-name i{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mintl);color:var(--mintd);
    font-style:normal;font-size:0.74rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
  .p-tot{font-size:0.78rem;font-weight:800;color:var(--muted)}
  .p-lib{padding:0.5rem 0 0.25rem;border-bottom:1px dashed var(--line)}
  .p-lib:last-child{border-bottom:0;padding-bottom:0}
  .p-libh{display:flex;align-items:center;gap:0.3rem;font-size:0.86rem;font-weight:900;color:var(--fg);flex-wrap:wrap}
  .p-libh .chip{margin-left:auto}

  /* ---------------- 바로 빌릴 수 있어요 (퀵 타일 3열) ---------------- */
  .quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.4rem;align-items:stretch}
  .tile{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.6rem 0.55rem 0.55rem;
    display:flex;flex-direction:column;min-width:0;border:1px solid transparent;
    font-family:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .12s ease}
  .tile:active{transform:scale(.98)}
  .tile.on{border-color:var(--mint);background:linear-gradient(165deg,var(--card) 55%,var(--mintl) 100%)}
  .tile>span{min-width:0}
  .tile-n,.tile-sub{display:block}
  .tile-lib{font-size:0.72rem;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:0.25rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-lib .dotlib{width:0.42rem;height:0.42rem}
  .tile-n{font-size:1.9rem;font-weight:900;line-height:1;letter-spacing:-.07rem;margin-top:0.32rem;color:var(--fg)}
  .tile-n span{font-size:0.7rem;font-weight:800;letter-spacing:0;margin-left:0.16rem;color:var(--muted)}
  .tile-sub{font-size:0.72rem;font-weight:700;color:var(--muted2);margin-top:0.2rem;line-height:1.35}
  .tile-chips{display:flex;flex-wrap:wrap;gap:0.2rem;margin-top:0.45rem;flex:1 1 auto;align-content:flex-start;min-width:0}
  .tile-chips span{font-size:0.68rem;font-weight:800;background:var(--mintl);color:var(--chipOkFg);
    padding:0.12rem 0.3rem;border-radius:0.35rem;max-width:100%;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile-chips span.more{background:var(--card2);color:var(--muted)}
  .tile-more{font-size:0.7rem;font-weight:800;color:var(--accent);margin-top:auto;padding-top:0.5rem;
    display:flex;align-items:center;gap:0.15rem;white-space:nowrap}
  @media (max-width: 519px){          /* 3열 좁은 폭에서는 책 제목 2개까지만 */
    .tile-chips span.c3,.tile-chips span.c4,.tile-chips span.cn{display:none}
  }
  @media (min-width: 560px){
    .quick{gap:0.55rem}
    .tile{padding:0.8rem 0.75rem 0.7rem}
    .tile-lib{font-size:0.8rem}
    .tile-n{font-size:2.3rem;letter-spacing:-.1rem}
    .tile-n span{font-size:0.86rem;margin-left:0.3rem}
    .tile-sub{font-size:0.76rem}
    .tile-chips span{font-size:0.72rem;padding:0.16rem 0.4rem}
    .tile-more{font-size:0.76rem;padding-top:0.6rem}
  }
  /* 펼친 권별 목록은 3열 카드 아래 전체 폭으로 */
  .tiledetail{margin-top:0.5rem;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
    border:1px solid var(--mintl);padding:0.7rem 0.85rem 0.5rem}
  .td-h{display:flex;align-items:center;gap:0.35rem;padding-bottom:0.45rem;border-bottom:1px solid var(--line)}
  .td-h b{font-size:0.95rem;font-weight:900;letter-spacing:-.02em}
  .td-n{font-size:0.76rem;font-weight:800;color:var(--muted2)}
  .td-x{margin-left:auto;font-family:inherit;font-size:0.76rem;font-weight:800;color:var(--muted);
    background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0.2rem 0.55rem;cursor:pointer}
  .td-x:active{transform:scale(.96)}
  .tl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0.2rem 0.5rem;padding:0.42rem 0;align-items:start}
  .tl-t{font-size:0.84rem;font-weight:800;color:var(--fg);line-height:1.4;overflow-wrap:anywhere}
  .tl-m{grid-column:1;font-size:0.74rem;font-weight:700;color:var(--muted2);line-height:1.4}
  .tl-row .exbtn{grid-column:2;grid-row:1 / span 2;align-self:center}
  .hintline{font-size:0.76rem;color:var(--muted2);font-weight:700;margin:0.45rem 0.1rem 0}

  /* ---------------- 주간 캘린더 ---------------- */
  .cal{padding:0.7rem 0.4rem 0.55rem}
  .cal-top{display:flex;align-items:center;justify-content:space-between;gap:0.35rem;padding:0 0.45rem 0.35rem}
  .cal-nav{font-family:inherit;font-size:1rem;font-weight:900;color:var(--muted);background:var(--card2);
    border:1px solid var(--line);border-radius:0.6rem;width:2.1rem;height:2.1rem;cursor:pointer;line-height:1}
  .cal-nav:disabled{opacity:.35;cursor:default}
  .cal-range{font-size:0.8rem;font-weight:900;color:var(--muted)}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:0.1rem}
  .cal-cell{display:flex;flex-direction:column;align-items:center;gap:0.28rem;background:none;border:0;
    padding:0.15rem 0;font-family:inherit;border-radius:0.8rem;cursor:pointer}
  .cal-cell:active{background:var(--card2)}
  .cal-dow{font-size:0.74rem;font-weight:800;color:var(--muted2)}
  .cal-dow.sun{color:var(--bad)} .cal-dow.sat{color:#3b82f6}
  html[data-theme="dark"] .cal-dow.sat{color:#7ab7ff}
  .cal-num{width:2.3rem;height:2.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:0.98rem;font-weight:900;color:var(--fg)}
  /* 오늘이지만 선택되지 않은 날 = 민트 링, 선택한 날 = 꽉 채은 민트 원 */
  .cell-today .cal-num{box-shadow:inset 0 0 0 2px var(--mint);color:var(--mintd)}
  .cell-sel .cal-num{background:linear-gradient(160deg,#34d399,var(--mint));color:#fff;
    box-shadow:0 5px 12px rgba(16,185,129,.4)}
  .cell-sel .cal-dow{color:var(--mintd)}
  .dots{height:0.42rem;display:flex;gap:0.15rem;align-items:center}
  .dot{width:0.3rem;height:0.3rem;border-radius:50%;display:inline-block}
  .dot.red{background:var(--bad)} .dot.mint{background:var(--mint)} .dot.amber{background:var(--warn)}
  .cal-legend{display:flex;gap:0.7rem;justify-content:center;margin-top:0.55rem;padding-top:0.5rem;border-top:1px solid var(--line)}
  .cal-legend span{font-size:0.73rem;font-weight:800;color:var(--muted2);display:flex;align-items:center;gap:0.25rem}

  .daycard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.7rem 0.9rem 0.2rem;margin-top:0.55rem}
  .daycard.single{max-width:none}
  .calday-empty{padding:0.55rem 0;color:var(--muted2);font-size:0.86rem;font-weight:700}
  .day-h{display:flex;align-items:center;gap:0.4rem;padding-bottom:0.45rem;border-bottom:1px solid var(--line)}
  .day-h b{font-size:0.98rem;font-weight:900}
  .day-h span{font-size:0.76rem;font-weight:800;color:var(--muted2)}
  .day-h .cnt{margin-left:auto;font-size:0.76rem;font-weight:900;color:var(--chipOkFg);background:var(--chipOkBg);
    padding:0.14rem 0.45rem;border-radius:999px}
  .ev{display:flex;align-items:center;gap:0.5rem;padding:0.55rem 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .ev-tag{font-size:0.7rem;font-weight:900;padding:0.16rem 0.4rem;border-radius:0.35rem;white-space:nowrap;flex:0 0 auto}
  .ev-tag.red{background:var(--tagRedBg);color:var(--tagRedFg)}
  .ev-tag.mint{background:var(--tagMintBg);color:var(--tagMintFg)}
  .ev-tag.amber{background:var(--tagAmberBg);color:var(--tagAmberFg)}
  .ev-t{font-size:0.86rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev-m{font-size:0.74rem;color:var(--muted2);font-weight:700;white-space:nowrap;flex:0 0 auto;max-width:42%;
    overflow:hidden;text-overflow:ellipsis}
  .nextweek{margin-top:0.55rem;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0.7rem 0.9rem}
  .nw-h{font-size:0.78rem;font-weight:900;color:var(--muted2);margin-bottom:0.3rem}
  .nw-row{display:flex;gap:0.45rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
    font-family:inherit;font-size:0.82rem;font-weight:700;color:var(--muted);padding:0.4rem 0;line-height:1.45;cursor:pointer}
  .nw-row:first-of-type{border-top:0}
  .nw-row:active{background:var(--card2)}
  .nw-row b{color:var(--fg);font-weight:900;min-width:2.6rem;flex:0 0 auto}
  .nw-row span{min-width:0;overflow-wrap:anywhere}

  /* ---------------- 리스트 카드 ---------------- */
  .row{display:block;background:var(--card);border-radius:0.95rem;box-shadow:var(--sh);
    padding:0.65rem 0.8rem 0.7rem;margin-bottom:0.45rem;min-width:0}
  .row .rtop{display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap;margin-bottom:0.28rem}
  .row .rleft{display:flex;align-items:center;gap:0.28rem;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .row .rright{display:flex;align-items:center;gap:0.28rem;margin-left:auto;flex:0 0 auto}
  .row .tt{font-size:0.96rem;font-weight:800;line-height:1.4;letter-spacing:-.01em;overflow-wrap:anywhere}
  .row .ss{font-size:0.79rem;color:var(--muted);margin-top:0.2rem;line-height:1.45;overflow-wrap:anywhere}
  .row .ss b{color:var(--fg);font-weight:800}
  .row .tiny{font-size:0.74rem;color:var(--muted2);font-weight:700;white-space:nowrap}
  .note{font-size:0.82rem;color:var(--muted);margin-top:0.4rem;padding-top:0.4rem;
    border-top:1px dashed var(--line2);line-height:1.5;overflow-wrap:anywhere}
  .exbtn{flex:0 0 auto;min-height:2rem;padding:0.25rem 0.55rem;border:1px solid var(--line);background:transparent;
    color:var(--muted2);border-radius:0.5rem;font-size:0.78rem;font-weight:800;font-family:inherit;
    cursor:pointer;line-height:1.2}
  .exbtn:active{background:var(--card2)}
  .head .ck{flex:0 0 auto;width:1.35rem;height:1.35rem;margin:0 0.15rem 0 0;accent-color:var(--accent);cursor:pointer}

  .dday{display:inline-block;font-weight:800;font-size:0.79rem;border-radius:999px;
    padding:0.16rem 0.5rem;white-space:nowrap;letter-spacing:-.01em;line-height:1.4}
  .dday.hot{background:var(--hotBg);color:var(--hotFg)}
  .dday.warn{background:var(--warnBg);color:var(--warnFg)}
  .dday.ok{background:var(--okBg);color:var(--okFg)}

  .pill{display:inline-block;font-size:0.76rem;font-weight:800;padding:0.16rem 0.45rem;border-radius:0.4rem;
    background:var(--pillBg);border:1px solid var(--line);color:var(--pillFg);line-height:1.5}
  .pill.sn{color:var(--chipOkFg);border-color:var(--chipOkBg);background:var(--chipOkBg)}
  .pill.hn{color:var(--chipInfoFg);border-color:var(--chipInfoBg);background:var(--chipInfoBg)}
  .pill.rm{color:var(--chipFullFg);border-color:var(--chipFullBg);background:var(--chipFullBg)}

  .badge{display:inline-block;font-size:0.76rem;font-weight:800;padding:0.18rem 0.5rem;border-radius:999px;white-space:nowrap;line-height:1.5}
  .st-prog{background:var(--warnBg);color:var(--warnFg)}
  .st-wait{background:var(--chipInfoBg);color:var(--chipInfoFg)}
  .st-end{background:var(--okBg);color:var(--okFg)}
  .st-done{background:var(--card2);color:var(--muted)}

  .cardgrid{display:block}
  .empty{text-align:center;color:var(--muted2);font-size:0.86rem;padding:1.2rem 0.6rem}
  .more{display:block;width:100%;margin:0.35rem 0 0.25rem;padding:0.7rem;border-radius:0.7rem;
    border:1px dashed var(--line2);background:transparent;color:var(--muted);font-size:0.88rem;
    font-weight:800;font-family:inherit;cursor:pointer;min-height:2.8rem}

  /* ---------------- 필터 · 검색 ---------------- */
  .filters{position:sticky;top:0;z-index:20;background:var(--bg);
    margin:0 -0.85rem 0.3rem;padding:0.3rem 0.85rem 0.45rem}
  .frow{display:flex;gap:0.3rem;overflow-x:auto;scrollbar-width:none;padding:0.05rem 0}
  .frow::-webkit-scrollbar{display:none}
  .chipbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:0.42rem 0.72rem;min-height:2.2rem;font-size:0.84rem;font-weight:800;
    cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:0.22rem}
  .chipbtn.on{background:var(--fg);color:var(--bg);border-color:transparent}
  .searchwrap{position:relative;margin:0.2rem 0 0.45rem}
  input[type=search]{width:100%;-webkit-appearance:none;appearance:none;
    background:var(--card);border:1px solid var(--line);border-radius:0.75rem;color:var(--fg);
    min-height:2.8rem;padding:0.6rem 0.8rem 0.6rem 2.2rem;font-size:0.92rem;font-family:inherit}
  input[type=search]::placeholder{color:var(--muted2)}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  .searchwrap .ic{position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);font-size:0.9rem;color:var(--muted2)}

  /* ---------------- 시리즈 ---------------- */
  .ser{background:var(--card);border-radius:0.95rem;box-shadow:var(--sh);padding:0.7rem 0.8rem;
    margin-bottom:0.5rem}
  .ser .head{display:flex;align-items:flex-start;gap:0.4rem;flex-wrap:wrap}
  .ser .nm{font-size:1rem;font-weight:900;letter-spacing:-.02em;flex:1 1 60%;min-width:0;overflow-wrap:anywhere;line-height:1.4}
  .ser .metaline{font-size:0.8rem;color:var(--muted);margin-top:0.3rem;line-height:1.5}
  .ser .metaline b{color:var(--fg)}
  .legend{font-size:0.78rem;color:var(--muted2);line-height:1.6;margin:0.2rem 0 0.5rem}
  .bar.serbar{margin-top:0.45rem}
  .bar i.g{background:linear-gradient(90deg,#e0603f,#ffab5e)}
  .vols{font-size:0.84rem;color:var(--fg);font-weight:650;letter-spacing:.01em;overflow-wrap:anywhere}
  .lbl{font-size:0.76rem;font-weight:800;color:var(--muted2);margin-right:0.28rem;letter-spacing:.02em;white-space:nowrap}
  .line{margin-top:0.3rem;display:flex;gap:0.2rem;align-items:baseline;flex-wrap:wrap}
  .chip2{display:inline-block;font-size:0.8rem;font-weight:800;padding:0.16rem 0.42rem;border-radius:0.4rem;
    background:var(--tagRedBg);color:var(--tagRedFg);margin:0.1rem 0.1rem 0 0;line-height:1.5}
  .chip2.inp{background:var(--tagAmberBg);color:var(--tagAmberFg)}
  .chip2.none{background:var(--okBg);color:var(--okFg)}

  /* ---------------- 시리즈 도구 ---------------- */
  .sertools{display:flex;gap:0.35rem;flex-wrap:wrap;align-items:center;margin:0.1rem 0 0.5rem}
  .sbtn{min-height:2.4rem;padding:0.45rem 0.75rem;border-radius:0.6rem;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:0.84rem;font-weight:800;font-family:inherit;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:0.22rem;line-height:1.2}
  .sbtn:active{transform:scale(.98)}
  .sbtn.add{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:900}
  .sbtn.copy{background:var(--card2);border-style:dashed}
  .sbtn.on{border-color:var(--accent);color:var(--accent);background:var(--card2)}
  .selbar{display:flex;gap:0.35rem;flex-wrap:wrap;background:var(--card2);border:1px dashed var(--line2);
    border-radius:0.8rem;padding:0.55rem;margin-bottom:0.55rem}
  .selbar .sbtn{flex:1 1 auto}
  .selbar .sbtn:disabled{opacity:.45}
  .sbtns{display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.55rem}
  .sbtns .sbtn{min-height:2.2rem;font-size:0.8rem;color:var(--muted);padding:0.35rem 0.65rem}
  .sbtns .sbtn.del{color:var(--bad)}
  .addform{background:var(--card);border:1px solid var(--line);border-radius:0.9rem;padding:0.8rem;
    margin-bottom:0.55rem;display:flex;flex-direction:column;gap:0.45rem}
  .addform label{font-size:0.8rem;font-weight:800;color:var(--muted)}
  .addform input,.addform textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:0.6rem;
    color:var(--fg);font-size:0.92rem;font-family:inherit;min-height:2.7rem;padding:0.55rem 0.7rem}
  .addform input:focus,.addform textarea:focus{outline:none;border-color:var(--accent)}
  .addform textarea{min-height:7rem;font-size:0.86rem;line-height:1.5;resize:vertical}
  .addform .fld{display:flex;flex-direction:column;gap:0.28rem;min-width:0}
  .addform .two{display:flex;gap:0.45rem}
  .addform .two .fld{flex:1}
  .formbtns{display:flex;gap:0.35rem;margin-top:0.1rem}
  .formbtns .sbtn{flex:1}
  .formerr{font-size:0.8rem;color:var(--bad);font-weight:800;min-height:1.1em;line-height:1.4}
  .smeta{margin-left:auto;font-size:0.78rem;color:var(--muted2);font-weight:700}

  /* ---------------- 한도 ---------------- */
  .lim{background:var(--card);border-radius:0.9rem;box-shadow:var(--sh);padding:0.75rem 0.85rem;margin-bottom:0.5rem}
  .lim .lh{display:flex;align-items:center;gap:0.35rem;font-size:0.86rem;font-weight:900;color:var(--muted);margin-bottom:0.45rem}
  .lim .lh .cap{margin-left:auto;font-weight:800;color:var(--muted2);font-size:0.78rem}
  .acc{display:flex;align-items:center;gap:0.45rem;margin-top:0.35rem}
  .acc .who{font-size:0.84rem;font-weight:800;width:3.4rem;flex:0 0 auto}
  .acc .track{flex:1;height:0.5rem;border-radius:999px;background:var(--ringbg);overflow:hidden;display:flex;border:1px solid var(--line)}
  .acc .track i{display:block;height:100%;background:linear-gradient(90deg,#34d399,var(--mint))}
  .acc .track.warn i{background:linear-gradient(90deg,#e0603f,#ffab5e)}
  .acc .num{font-size:0.82rem;font-weight:900;color:var(--muted);width:2.4rem;text-align:right;flex:0 0 auto}
  .acc.full .num{color:var(--warnFg)}

  /* ---------------- 규칙 · 도서관 규정 ---------------- */
  .rule{display:flex;gap:0.55rem;background:var(--card);border-radius:0.9rem;box-shadow:var(--sh);
    padding:0.8rem;margin-bottom:0.5rem}
  .rule .no{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:0.5rem;background:var(--mint);color:#fff;
    font-weight:900;font-size:0.8rem;display:flex;align-items:center;justify-content:center}
  .rule .rt{font-size:0.98rem;font-weight:900;letter-spacing:-.01em;line-height:1.4}
  .rule .rd{font-size:0.84rem;color:var(--muted);margin-top:0.25rem;line-height:1.6}
  .libc{background:var(--card);border-radius:0.9rem;box-shadow:var(--sh);padding:0.8rem;margin-bottom:0.5rem}
  .libc .ln{font-size:0.98rem;font-weight:900;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap}
  .libc dl{margin:0.5rem 0 0;display:grid;grid-template-columns:4.6rem 1fr;gap:0.3rem 0.5rem;font-size:0.84rem}
  .libc dt{color:var(--muted2);font-weight:800}
  .libc dd{margin:0;color:var(--fg);line-height:1.55;overflow-wrap:anywhere}
  .fine{font-size:0.74rem;color:var(--muted2);line-height:1.7;margin:1.2rem 0 0;padding:0.7rem 0.8rem;
    border:1px dashed var(--line2);border-radius:0.7rem;overflow-wrap:anywhere}
  .callout{display:flex;gap:0.5rem;background:var(--card);border:1px solid var(--line);border-radius:0.8rem;
    padding:0.7rem 0.8rem;font-size:0.84rem;color:var(--muted);line-height:1.6;margin-top:0.55rem;box-shadow:var(--sh)}
  .callout b{color:var(--fg)}
  .callout .ic{flex:0 0 auto}

  /* ---------------- 추천도서 · 신간 ---------------- */
  .bk{display:grid;grid-template-columns:4.6rem 1fr;gap:0.65rem;background:var(--card);
    border-radius:0.95rem;box-shadow:var(--sh);padding:0.75rem;margin-bottom:0.55rem;align-items:start}
  .bkc{position:relative;width:4.6rem;aspect-ratio:2/3;border-radius:0.45rem;overflow:hidden;
    background:var(--card2);border:1px solid var(--line)}
  .bkc img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
  .bkph{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0.15rem;font-size:0.68rem;font-weight:800;color:var(--muted2);text-align:center;padding:0.2rem;line-height:1.25}
  .bkph .big{font-size:1.4rem;line-height:1}
  .bki{min-width:0}
  .bkmeta{display:flex;align-items:center;gap:0.28rem;flex-wrap:wrap;margin-bottom:0.25rem}
  .bkt{font-size:1rem;font-weight:900;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
  .bks{font-size:0.8rem;color:var(--muted);margin-top:0.22rem;line-height:1.45;overflow-wrap:anywhere}
  .bks b{color:var(--fg);font-weight:800}
  .bkwhy{margin-top:0.4rem;background:var(--card2);border:1px solid var(--line);border-radius:0.6rem;
    padding:0.42rem 0.5rem;font-size:0.8rem;color:var(--fg);line-height:1.5;overflow-wrap:anywhere}
  .bkwhy .k{display:block;font-size:0.72rem;font-weight:800;color:var(--accent);margin-bottom:0.1rem}
  .bkintro{font-size:0.82rem;color:var(--muted);margin-top:0.35rem;line-height:1.55;overflow-wrap:anywhere}
  .bklinks{display:flex;gap:0.25rem;flex-wrap:wrap;margin-top:0.45rem}
  .bklinks a{display:inline-flex;align-items:center;gap:0.15rem;text-decoration:none;font-size:0.76rem;font-weight:800;
    padding:0.25rem 0.45rem;border-radius:0.45rem;border:1px solid var(--line);background:var(--card2);color:var(--accent)}
  .bkbtns{display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.5rem}
  .bkbtns .sbtn{min-height:2.2rem;font-size:0.8rem;padding:0.35rem 0.65rem}
  .sbtn.mon{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:900}
  .sbtn.mon.done{background:var(--card2);color:var(--good);border-color:var(--line);border-style:dashed}
  .availtag{font-size:0.74rem;font-weight:800;padding:0.16rem 0.42rem;border-radius:999px;background:var(--card2);
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .availtag.pre{color:var(--warnFg);border-color:var(--warnBg);background:var(--warnBg)}

  /* ---------------- 하단 5탭 바 ---------------- */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;
    width:100%;max-width:calc(560px * var(--z));
    background:var(--card);border-top:1px solid var(--line2);
    display:grid;grid-template-columns:repeat(5,1fr);gap:0.1rem;
    padding:0.42rem 0.3rem calc(0.42rem + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(16,24,40,.07)}
  .tb{display:flex;flex-direction:column;align-items:center;gap:0.08rem;background:none;border:0;
    padding:0.15rem 0;font-family:inherit;font-size:0.72rem;font-weight:800;color:var(--muted2);cursor:pointer;
    min-height:2.6rem;justify-content:center;line-height:1.15}
  .tb .ic{font-size:1.2rem;line-height:1.05}
  .tb.on{color:var(--accent)}
  .tb.on .ic{filter:drop-shadow(0 3px 6px rgba(16,185,129,.35))}

  /* ---------------- toast ---------------- */
  .toast{position:fixed;left:50%;bottom:calc(4.9rem + env(safe-area-inset-bottom));transform:translate(-50%,1rem);z-index:99;
    max-width:calc(540px * var(--z) - 1.4rem);
    background:var(--toastBg);color:var(--toastFg);border:1px solid var(--toastLine);border-radius:0.8rem;
    padding:0.65rem 0.85rem;font-size:0.84rem;font-weight:700;line-height:1.45;
    box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .refreshbox{margin-top:0.5rem;background:var(--card);border:1px dashed var(--line2);border-radius:0.7rem;padding:0.6rem 0.7rem}
  .refreshbox p{margin:0 0 0.4rem;font-size:0.8rem;color:var(--muted);line-height:1.5}
  .refreshbox textarea{width:100%;min-height:3.4rem;background:var(--card2);border:1px solid var(--line);border-radius:0.55rem;
    color:var(--fg);font-family:inherit;font-size:0.86rem;padding:0.5rem 0.6rem;line-height:1.5;resize:vertical}

  /* ---------------- PC 넓은 화면 (960px 이상) ---------------- */
  .grid3{display:block}
  @media (min-width: 960px){
    html,html[data-fs="0"]{--fs:15px}
    html[data-fs="1"]{--fs:16px}
    html[data-fs="2"]{--fs:17px}
    html[data-fs="3"]{--fs:18.5px}
    body{padding-top:3.5rem;padding-bottom:1.8rem}
    .wrap{max-width:1080px;padding:0 1.5rem}
    header.hd{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:1rem}
    .brand{grid-column:1}
    .hctl{grid-column:3}
    .sub{grid-column:1/-1;grid-row:2}
    .asofrow{grid-column:1/-1;grid-row:3}
    .cbtn{width:2.2rem;height:2.2rem;font-size:0.85rem}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.6rem;align-items:start}
    .grid3 .libcard,.grid3 .pcard,.grid3 .daycard,.grid3 .row,.grid3 .nextweek{margin-top:0;margin-bottom:0}
    .quick{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.6rem;align-items:start}
    .cardgrid .row{margin-bottom:0}
    .cardgrid .ser{margin-bottom:0}
    .sum-row{gap:1.4rem}
    .cal-num{width:2.6rem;height:2.6rem;font-size:1.05rem}
    .seg{max-width:30rem}
    #kpi .banner{margin-top:0.2rem}
    /* 탭 바는 PC 에서 위쪽 가로 메뉴로 */
    .tabbar{top:0;bottom:auto;left:50%;transform:translateX(-50%);width:100%;max-width:1080px;
      grid-template-columns:repeat(5,minmax(0,1fr));gap:0.3rem;
      padding:0.3rem 0.8rem;border-top:0;border-bottom:1px solid var(--line2);border-radius:0;
      box-shadow:0 6px 18px rgba(16,24,40,.06)}
    .tb{flex-direction:row;gap:0.35rem;min-height:2.4rem;font-size:0.86rem}
    .tb .ic{font-size:1rem}
    .toast{bottom:1.6rem}
  }

  /* ---------- 잠금 화면 ---------- */
  #app[hidden]{display:none!important}
  .lock{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
    padding:1.4rem;background:var(--bg2);overflow:auto}
  .lock.off{display:none}
  .lockcard{width:100%;max-width:calc(420px * var(--z));background:var(--card);border:1px solid var(--line);
    border-radius:1.3rem;padding:1.6rem 1.25rem 1.15rem;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
  .lockicon{font-size:2.6rem;line-height:1}
  .lockttl{margin:.55rem 0 0;font-size:1.22rem;font-weight:850;letter-spacing:-.01em}
  .locksub{margin:.35rem 0 1rem;font-size:.86rem;color:var(--muted);line-height:1.5}
  .pininput{width:100%;font-size:1.9rem;font-weight:800;letter-spacing:.5em;text-align:center;
    padding:.7rem .4rem .7rem .9rem;border-radius:.9rem;border:1px solid var(--line);background:var(--bg2);
    color:var(--fg);font-family:inherit;outline:none}
  .pininput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,183,255,.18)}
  .lockchk{display:flex;align-items:center;justify-content:center;gap:.45rem;margin:.9rem 0 1rem;
    font-size:.9rem;color:var(--fg);font-weight:600}
  .lockchk input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
  .lockbtn{width:100%;padding:.85rem 1rem;border-radius:.9rem;border:0;background:var(--accent);
    color:var(--accent-ink);font-family:inherit;font-size:1rem;font-weight:850;cursor:pointer}
  .lockbtn:active{transform:scale(.985)}
  .lockbtn[disabled]{opacity:.55}
  .lockbtn.small{width:auto;padding:.62rem .9rem;font-size:.9rem;flex:1}
  .lockerr{min-height:1.15rem;margin-top:.55rem;font-size:.85rem;font-weight:700;color:var(--bad);line-height:1.4}
  .lockforget{margin-top:.85rem;background:none;border:0;color:var(--muted2);font-family:inherit;
    font-size:.82rem;font-weight:600;text-decoration:underline;cursor:pointer}
  /* ---------- 동기화 시트 ---------- */
  .sheet{position:fixed;inset:0;z-index:130;display:none}
  .sheet.on{display:block}
  .sheetbg{position:absolute;inset:0;background:rgba(4,7,12,.62)}
  .sheetcard{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
    max-width:calc(540px * var(--z));margin:0 auto;background:var(--card);border:1px solid var(--line);
    border-radius:1.2rem 1.2rem 0 0;padding:1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom))}
  .sheethead{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .sheethead b{font-size:1.05rem}
  .sheetx{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:var(--card2);
    color:var(--fg);font-family:inherit;font-size:.95rem;cursor:pointer}
  .sheetp{margin:.6rem 0 .5rem;font-size:.86rem;color:var(--muted);line-height:1.55}
  .syncstate{display:block;font-size:.85rem;font-weight:700;color:var(--accent);background:var(--card2);
    border:1px solid var(--line);border-radius:.7rem;padding:.55rem .7rem;margin:.2rem 0 .85rem;line-height:1.45;
    word-break:break-all}
  .syncstate.bad{color:var(--bad)}
  .fldlbl{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin:0 0 .3rem}
  .patinput{width:100%;padding:.65rem .7rem;border-radius:.7rem;border:1px solid var(--line);background:var(--bg2);
    color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:.86rem}
  .sheetrow{display:flex;gap:.45rem;margin-top:.6rem}
  .ghostbtn{flex:1;padding:.6rem .9rem;border-radius:.9rem;border:1px solid var(--line);background:var(--card2);
    color:var(--fg);font-family:inherit;font-size:.9rem;font-weight:800;cursor:pointer}
  .sheethint{margin:.8rem 0 0;font-size:.79rem;color:var(--muted2);line-height:1.55}
  .sheetlink{display:inline-block;margin-top:.5rem;font-size:.82rem;font-weight:800;color:var(--accent);
    text-decoration:none}
  /* 헤더 버튼 5개가 한 줄에 들어가게 조금 좁힌다 */
  .hctl{gap:0.22rem}
  .hctl .cbtn{width:1.95rem;height:1.95rem;font-size:0.78rem}
  /* 우측 상단 동기화 알약 */
  .syncpill{position:fixed;top:calc(env(safe-area-inset-top) + .4rem);right:.6rem;z-index:110;
    max-width:72vw;padding:.34rem .62rem;border-radius:999px;font-size:.78rem;font-weight:800;
    background:#1f2632;border:1px solid #33405a;color:#fff;opacity:0;transform:translateY(-.3rem);
    transition:opacity .16s ease,transform .16s ease;pointer-events:none;text-align:center}
  .syncpill.on{opacity:1;transform:translateY(0)}
  .syncpill.bad{background:#3a1d24;border-color:#7a3345}
  html[data-theme="light"] .syncpill{background:#111827;border-color:#111827}
</style>
</head>

<script>
window.LibUI = { mount: function(DATA, OV){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var WD = ['일','월','화','수','목','금','토'];

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  /* 데이터 메모의 **강조** 표기를 굵게 */
  function noteHtml(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
  function parseDate(s){
    if(!s) return null;
    var p = String(s).split('-');
    if(p.length < 3) return null;
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function today(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function ymd(d){
    var m = ('0' + (d.getMonth()+1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  function days(s){
    var d = parseDate(s); if(!d) return null;
    return Math.round((d - today()) / 86400000);
  }
  function md(s){ var d = parseDate(s); if(!d) return s; return (d.getMonth()+1) + '/' + d.getDate(); }
  function mdw(s){ var d = parseDate(s); if(!d) return s; return (d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')'; }
  function ddayLabel(n){
    if(n === null) return '';
    if(n < 0) return 'D+' + (-n);
    if(n === 0) return 'D-day';
    return 'D-' + n;
  }
  function ddayClass(n){
    if(n === null) return 'ok';
    if(n <= 3) return 'hot';
    if(n <= 7) return 'warn';
    return 'ok';
  }
  function ranges(arr){
    if(!arr || !arr.length) return '—';
    var out = [], i = 0;
    while(i < arr.length){
      var start = arr[i], end = arr[i];
      while(i + 1 < arr.length && arr[i+1] === end + 1){ i++; end = arr[i]; }
      out.push(start === end ? String(start) : start + '~' + end);
      i++;
    }
    return out.join(', ');
  }

  var LIBS = ['성남위례','하남위례','위례래미안'];
  function libKey(lib){
    var s = String(lib||'');
    return s.indexOf('성남') >= 0 ? 'sn' : (s.indexOf('하남') >= 0 ? 'hn' : 'ra');
  }
  function libDot(lib){ return '<i class="dotlib ' + libKey(lib) + '"></i>'; }
  function libShort(lib){ return String(lib || '').replace('성남위례','성남').replace('하남위례','하남').replace('위례래미안','래미안'); }
  function libPill(lib){
    return '<span class="pill ' + libKey(lib) + '">' + esc(lib) + '</span>';
  }
  function capMap(){
    if(DATA.caps) return DATA.caps;
    return {'성남위례':{loan:6,reserve:3,hold:3,holdTotal:6}, '하남위례':{loan:5,reserve:2,hold:2},
            '위례래미안':{loan:5,reserve:null,hold:null}};
  }
  function capOf(lib, kind){
    var m = capMap()[lib];
    if(!m) return null;
    var v = m[kind];
    return (v === undefined || v === null) ? null : v;
  }
  function whoCap(lib, kind){         /* 도서관 한 칸 = 계정 3개 합 */
    var m = capMap()[lib];
    if(m && kind === 'hold' && m.holdTotal !== undefined && m.holdTotal !== null) return m.holdTotal;
    var c = capOf(lib, kind);
    return c ? c * 3 : null;
  }
  function liveLoans(who, lib){ return (DATA.loans||[]).filter(function(x){ return x.who === who && x.lib === lib; }); }
  function liveRes(who, lib){ return (DATA.reserves||[]).filter(function(x){ return x.who === who && x.lib === lib; }); }
  function liveHolds(who, lib){ return (DATA.holds||[]).filter(function(x){ return x.who === who && x.lib === lib; }); }
  function whoList(){
    var out = [];
    ((DATA.limits||[]).forEach(function(g){
      (g.accounts||[]).forEach(function(a){ if(a.who && out.indexOf(a.who) < 0) out.push(a.who); });
    }));
    return out;
  }
  function short(t){
    var s = String(t==null?'':t).replace(/^\([^)]*\)\s*/,'').replace(/^\[[^\]]*\]\s*/,'');
    return s.length > 18 ? s.slice(0,18) + '…' : s;
  }
  function untilOf(x){
    if(x && x.until) return x.until;
    var n = String((x && x.note) || '');
    var m = n.match(/예약만기\s*(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[1] + '-' + m[2] + '-' + m[3];
    m = n.match(/(\d{1,2})\/(\d{1,2})\s*까지/);      /* '11/28까지 대출' 같은 문구 */
    if(m){
      var y = today().getFullYear();
      return y + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);
    }
    return '';
  }
  function whenLabel(due){
    var n = days(due);
    if(n === null) return '기한 확인';
    if(n < 0) return md(due) + ' 지남';
    if(n === 0) return '오늘까지';
    if(n === 1) return '내일까지';
    return 'D-' + n + ' · ' + md(due) + '까지';
  }
  /* 지금 위례에서 받을 수 있는 것: 예약 도착 + 상호대차 입수 */
  function pickupItems(){
    var out = [];
    (DATA.reserves||[]).forEach(function(r){
      if(r.arrived){
        out.push({t:r.t, who:r.who, lib:r.lib, until:untilOf(r), kind:'예약', tag:'도착', note:r.note||''});
      }
    });
    (DATA.holds||[]).forEach(function(h){
      if(h.status === '입수'){
        out.push({t:h.t, who:h.who, lib:h.lib, until:untilOf(h), kind:'상호대차', tag:'입수', note:h.note||''});
      }
    });
    out.sort(function(a,b){
      if(!a.until) return 1;
      if(!b.until) return -1;
      if(a.until < b.until) return -1;
      if(a.until > b.until) return 1;
      return 0;
    });
    return out;
  }
  function pickupByLib(lib){ return pickupItems().filter(function(p){ return p.lib === lib; }); }
  function pickupByLibWho(lib, who){ return pickupItems().filter(function(p){ return p.lib === lib && p.who === who; }); }
  function qtyOf(x){ return (x && x.qty) ? x.qty : 1; }
  function availByLib(lib){ return (DATA.available||[]).filter(function(x){ return x.lib === lib && !isTodoHidden(x.t); }); }
  function availQty(lib){ return availByLib(lib).reduce(function(a,x){ return a + qtyOf(x); }, 0); }
  function flagOf(who, lib){
    var arr = DATA.accountFlags || [];
    for(var i=0;i<arr.length;i++){
      if(arr[i].who === who && arr[i].lib === lib) return arr[i];
    }
    return null;
  }

  /* 카드 한 장 = 뱃지 줄 → 큰 제목 → 계정·설명 → 메모 */
  function rowCard(t, top, meta, note, right){
    var h = '<div class="row">';
    if(top || right){
      h += '<div class="rtop">' +
        (top ? '<div class="rleft">' + top + '</div>' : '<div class="rleft"></div>') +
        (right ? '<div class="rright">' + right + '</div>' : '') + '</div>';
    }
    h += '<div class="tt">' + esc(t) + '</div>';

  function fallbackCopy(txt, done){
    try{

      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    }catch(e){ done(false); }
  }

    try{

        navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ fallbackCopy(txt, done); });

  function fitWide(){
    try{
      var de = document.documentElement;
      var vw = window.innerWidth || 0;
      var sw = (window.screen && window.screen.width) || 0;
      var dpr = window.devicePixelRatio || 1;
      var dw = sw;
      if(dw > 700 && dpr >= 1.5 && dw / dpr < 700) dw = dw / dpr;
      var portrait = !!(window.screen && window.screen.height && window.screen.height > window.screen.width);
      var z = 1;
      if(vw >= 600 && dw && vw > dw * 1.1){
        z = vw / dw;
      } else if(vw >= 700 && portrait && dpr >= 1.5){
        z = vw / 430;
      }
      if(!(z > 1.01)) return;
      if(z > 1.9) z = 1.9;
      de.setAttribute('data-fit', '1');
      if(de.style && de.style.setProperty) de.style.setProperty('--z', z.toFixed(3));
      else de.setAttribute('style', '--z:' + z.toFixed(3));
    }catch(e){}
  }

  function ringSvg(n, cap){

    return '<svg class="ring" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="전체 대출 ' + n + '권 / 한도 ' + cap + '권">' +
      '<circle cx="48" cy="48" r="42" fill="none" stroke="var(--ringbg)" stroke-width="9"/>' +
      '<circle cx="48" cy="48" r="42" fill="none" stroke="var(--mint)" stroke-width="9" stroke-linecap="round" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 48 48)"/>' +
      '<text x="48" y="45" text-anchor="middle" font-size="26" font-weight="900" fill="var(--fg)">' + n + '</text>' +
      '<text x="48" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--muted2)">/' + cap + '권</text>' +

  function metricRow(k, n, cap, fullWord, unit, opt){
    opt = opt || {};
    var pct, full = false, cls;
    if(cap){
      pct = Math.min(100, Math.round(n / cap * 100));
      full = n >= cap;
      cls = full ? 'full' : '';
    }else if(opt.max){
      /* 비치중 — 세 곳 중 가장 많은 권수를 100% 로 두고 비교, 1권도 눈에 보이게 최소 8% */
      pct = n > 0 ? Math.max(8, Math.round(n / opt.max * 100)) : 0;
      cls = 'avail' + (opt.tone ? ' lib-' + opt.tone : '');
    }else{
      pct = Math.min(100, n * 20);
      cls = 'unk';
    }
    var val = cap
      ? '<b>' + n + '</b>/' + cap + (full ? ' ' + (fullWord || '만석') : '')
      : '<b>' + n + '</b>' + (unit || '건');
    var inner = '<span class="k">' + k + '</span>' +
      '<span class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></span>' +
      '<span class="v">' + val + (opt.jump ? '<span class="arr">›</span>' : '') + '</span>';
    if(opt.jump){
      return '<button type="button" class="metric availrow" data-tilejump="' + esc(opt.jump) + '" ' +
        'aria-label="' + esc(k) + ' ' + n + '권 — 바로 빌릴 수 있어요 목록 보기">' + inner + '</button>';
    }
    return '<div class="metric">' + inner + '</div>';
  }

        '<span class="p-tot">' + tot + '</span><span class="goarrow">›</span></div>' + body + '</div>';
    }).join('');
  }

  /* ---------------- 바로 빌릴 수 있어요 (퀵 타일) ---------------- */
  function tileListHtml(lib){
    var pk = pickupByLib(lib), av = availByLib(lib), list = '';
    pk.forEach(function(p){
      list += '<div class="tl-row"><div class="tl-t">' + esc(p.t) + '</div>' +
        '<div class="tl-m">' + esc(p.kind) + ' ' + esc(p.tag) + ' · ' + esc(p.who) + ' · ' +
        esc(p.until ? md(p.until) + '까지' : '만기 확인') + '</div></div>';
    });
    av.forEach(function(a){
      var q = qtyOf(a);
      list += '<div class="tl-row"><div class="tl-t">' + esc(a.t) + '</div>' +
        '<div class="tl-m">비치중' + (q > 1 ? ' · ' + q + '권' : '') + ' · 지금 대출 가능</div>' +
        exBtn(a.t) + '</div>';
    });
    if(!list) list = '<div class="tl-row"><div class="tl-m">지금은 바로 빌릴 책이 없어요.</div></div>';
    return list;
  }
  function quickTiles(){
    var total = 0;
    var aq = LIBS.map(function(lib){ return availQty(lib); });
    var tiles = LIBS.map(function(lib, idx){
      var pk = pickupByLib(lib), av = availByLib(lib);
      var n = pk.length + aq[idx];
      total += n;
      var subBits = [];
      if(pk.length) subBits.push('도착 ' + pk.length + '권');
      if(aq[idx]) subBits.push('비치 ' + aq[idx] + '권');
      if(!subBits.length) subBits.push('지금은 없음');
      var titles = pk.map(function(p){ return p.t; }).concat(av.map(function(a){ return a.t; }));
      var chips = titles.slice(0, 4).map(function(t, i){
        return '<span class="c' + (i + 1) + '">' + esc(short(t)) + '</span>';
      }).join('');
      if(titles.length > 4) chips += '<span class="cn more">+' + (titles.length - 4) + '</span>';
      var open = (state.tileOpen === lib);
      return '<button type="button" class="tile' + (open ? ' on' : '') + '" data-tilelib="' + esc(lib) + '" ' +
        'aria-expanded="' + (open ? 'true' : 'false') + '"' + (open ? ' aria-controls="tileDetail"' : '') + '>' +
        '<span class="tile-lib">' + libDot(lib) + esc(lib) + '</span>' +
        '<span class="tile-n">' + n + '<span>권</span></span>' +
        '<span class="tile-sub">' + subBits.join(' · ') + '</span>' +
        '<span class="tile-chips">' + chips + '</span>' +
        '<span class="tile-more">' + (open ? '목록 접기 ⌃' : '목록 펼치기 ⌄') + '</span></button>';
    }).join('');
    var detail = '';
    var oi = state.tileOpen ? LIBS.indexOf(state.tileOpen) : -1;
    if(oi >= 0){
      var oq = pickupByLib(state.tileOpen).length + aq[oi];
      detail = '<div class="tiledetail" id="tileDetail">' +
        '<div class="td-h">' + libDot(state.tileOpen) + '<b>' + esc(state.tileOpen) + '</b>' +
        '<span class="td-n">' + oq + '권</span>' +
        '<button type="button" class="td-x" data-tileclose="1">접기 ✕</button></div>' +
        tileListHtml(state.tileOpen) + '</div>';
    }
    return '<div class="sec" id="sec-tiles"><h2>바로 빌릴 수 있어요</h2>' +
      '<span class="hint">총 ' + total + '권 · 지금 서가에</span></div>' +
      '<div class="quick">' + tiles + '</div>' + detail +
      '<div class="hintline">카드를 누르면 아래에 그 도서관 권별 목록이 펼쳐집니다.</div>';
  }

  /* ---------------- 이번 주 반납 · 수령 ---------------- */
  function weekEvents(){
    var ev = [];
    (DATA.loans||[]).forEach(function(l){
      ev.push({date:l.due, type:'반납', cls:'red', dot:'red', t:l.t, who:l.who, lib:l.lib, note:l.note || ''});
    });
    pickupItems().forEach(function(p){
      ev.push({date:p.until, type:(p.kind === '예약' ? '만기' : '수령'), cls:(p.kind === '예약' ? 'amber' : 'mint'),
               dot:(p.kind === '예약' ? 'amber' : 'mint'), t:p.t, who:p.who, lib:p.lib, note:p.note || ''});
    });
    return ev.filter(function(e){ return !!e.date; });
  }
  function weekSection(){
    var t = today();
    var wk = state.calWeek || 0;
    var dow = t.getDay();
    var start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow + wk * 7);
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    var sStr = ymd(start), eStr = ymd(end);
    var tStr = ymd(t);
    var ev = weekEvents();
    var inWeek = ev.filter(function(x){ return x.date >= sStr && x.date <= eStr; });

    /* 선택한 날짜 — 범위를 벗어나면 오늘(이번 주) 또는 그 주 첫 일정 날짜로 */
    var sel = state.calSel;
    if(!sel || sel < sStr || sel > eStr){
      if(wk === 0) sel = tStr;
      else {
        var dset = {};
        inWeek.forEach(function(x){ dset[x.date] = 1; });
        var dkeys = Object.keys(dset).sort();
        sel = dkeys.length ? dkeys[0] : sStr;
      }
    }

    var cells = '';
    for(var i = 0; i < 7; i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var ds = ymd(d);
      var dayEv = inWeek.filter(function(x){ return x.date === ds; });
      var types = [];
      dayEv.forEach(function(x){ if(types.indexOf(x.dot) < 0) types.push(x.dot); });
      var dots = types.slice(0, 3).map(function(k){ return '<i class="dot ' + k + '"></i>'; }).join('');
      var dw = d.getDay();
      cells += '<button type="button" class="cal-cell' + (ds === tStr ? ' cell-today' : '') + (ds === sel ? ' cell-sel' : '') + '" ' +
        'data-day="' + ds + '" aria-pressed="' + (ds === sel ? 'true' : 'false') + '" ' +
        'aria-label="' + md(ds) + ' ' + WD[dw] + '요일 ' + (dayEv.length ? dayEv.length + '건' : '일정 없음') + '">' +
        '<span class="cal-dow' + (dw === 0 ? ' sun' : (dw === 6 ? ' sat' : '')) + '">' + WD[dw] + '</span>' +
        '<span class="cal-num">' + d.getDate() + '</span>' +
        '<span class="dots">' + dots + '</span></button>';
    }
    var wkLabel = wk === 0 ? '이번 주' : (wk === 1 ? '다음 주' : (wk === -1 ? '지난 주' : (wk > 0 ? wk + '주 후' : Math.abs(wk) + '주 전')));
    var h = '<div class="sec"><h2>반납·수령 달력</h2><span class="hint">' + wkLabel + '</span></div>';
    h += '<div class="card cal" id="calcard">' +
      '<div class="cal-top">' +
        '<button type="button" class="cal-nav" data-calweek="-1" aria-label="지난 주 보기">‹</button>' +
        '<span class="cal-range">' + md(sStr) + ' ~ ' + md(eStr) + '</span>' +
        '<button type="button" class="cal-nav" data-calweek="1" aria-label="다음 주 보기">›</button>' +
      '</div>' +
      '<div class="cal-days">' + cells + '</div>' +
      '<div class="cal-legend"><span><i class="dot red"></i>반납</span>' +
      '<span><i class="dot mint"></i>수령</span><span><i class="dot amber"></i>예약만기</span></div></div>';

    /* 선택한 날짜의 반납·수령·예약만기 */
    var list = inWeek.filter(function(x){ return x.date === sel; });
    var dt = parseDate(sel);
    var diff = dt ? Math.round((dt - t) / 86400000) : null;
    var lab = diff === 0 ? '오늘' : (diff === 1 ? '내일' : (diff === -1 ? '어제' : (dt ? WD[dt.getDay()] + '요일' : '')));
    h += '<div class="daycard single" id="calday"><div class="day-h"><b>' + lab + '</b><span>' + md(sel) + '</span>' +
      '<span class="cnt">' + list.length + '건</span></div>';
    if(list.length){
      list.forEach(function(x){
        h += '<div class="ev"><span class="ev-tag ' + x.cls + '">' + x.type + '</span>' +
          '<span class="ev-t">' + esc(x.t) + '</span>' +
          '<span class="ev-m">' + esc(x.who) + ' · ' + esc(libShort(x.lib)) + '</span></div>';
      });
    } else {
      h += '<div class="calday-empty">' +
        (diff === 0 ? '오늘 예정된 반납·만기가 없어요' : '이 날짜에는 반납·수령·예약만기가 없어요') + '</div>';
    }
    h += '</div>';


    /* 이 주 뒤 2주 일정 — 날짜를 누르면 그 주로 이동해 선택 */
    var nextStart = ymd(new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1));
    var nextEnd = ymd(new Date(end.getFullYear(), end.getMonth(), end.getDate() + 14));
    var nextEv = ev.filter(function(x){ return x.date >= nextStart && x.date <= nextEnd; });
    if(nextEv.length){
      var groups = {};
      nextEv.forEach(function(x){ (groups[x.date] = groups[x.date] || []).push(x); });
      var keys = Object.keys(groups).sort();
      var rows = keys.map(function(k){
        var g = groups[k];
        var partMap = {};
        g.forEach(function(x){ partMap[x.type] = (partMap[x.type] || 0) + 1; });
        var head = Object.keys(partMap).map(function(t){ return t + ' ' + partMap[t]; }).join(' · ');
        var names = g.slice(0, 2).map(function(x){ return short(x.t); }).join(' · ');
        if(g.length > 2) names += ' 외 ' + (g.length - 2);
        return '<button type="button" class="nw-row" data-day="' + k + '"><b>' + md(k) + '</b><span>' + esc(head + ' — ' + names) + '</span><span class="goarrow">›</span></button>';
      }).join('');
      h += '<div class="nextweek"><div class="nw-h">이후 2주 · 날짜를 누르면 그 주로 이동</div>' + rows + '</div>';
    }
    return h;
  }

  /* ---------------- 상호대차 · 타관 대기 · 신간 ---------------- */
  function holdSection(){
    var list = (DATA.holds||[]).filter(function(x){ return x.status !== '입수'; });
    var h = '<div class="sec"><h2>상호대차 진행</h2><span class="n">' + list.length + '</span>' +
      '<span class="hint">입수 후 3일 내 대출</span></div>';
    h += list.length ? '<div class="grid3">' + list.map(function(x){
      return rowCard(
        x.t,
        libPill(x.lib) + '<span class="dday warn">' + esc(x.status) + '</span>',
        '<b>' + esc(x.who) + '</b> · ' + esc(x.from) + ' → ' + esc(x.to),
        x.status + ' · ' + md(x.since) + ' 신청' + (x.note ? ' · ' + x.note : '')
      );
    }).join('') + '</div>' : '<div class="empty">진행 중인 상호대차가 없습니다</div>';
    return h;
  }
  function simpleRows(list, withEx){
    return list.map(function(x){
      var top = x.lib ? libPill(x.lib) : '';
      if(x.rank) top += '<span class="dday ok">' + x.rank + '순위</span>';
      if(x.date){
        top += x.past
          ? '<span class="dday ok">출간</span><span class="tiny">' + md(x.date) + '</span>'
          : '<span class="dday warn">' + ddayLabel(days(x.date)) + '</span><span class="tiny">' + md(x.date) + ' 출간</span>';
      }
      return rowCard(x.t, top, noteHtml(x.note || ''), '', withEx ? exBtn(x.t) : '');
    }).join('');
  }
  function monitorSection(){
    var mo = todoVisible(DATA.monitor || []);
    var up = todoVisible(DATA.upcoming || []).slice().sort(function(a,b){
      var da = a.date || '9999-12-31', db = b.date || '9999-12-31';
      return da < db ? -1 : (da > db ? 1 : 0);
    });
    var hidden = ((DATA.monitor||[]).length - mo.length) + ((DATA.upcoming||[]).length - up.length) +
      ((DATA.available||[]).length - (DATA.available||[]).filter(function(x){ return !isTodoHidden(x.t); }).length);
    var h = '';
    if(hidden){
      h += '<div class="callout"><span class="ic">🙈</span><div>제외한 <b>' + hidden + '건</b>은 이 화면에서 숨겼습니다. ' +
        '시리즈 탭 <b>제외됨</b> 칩에서 다시 포함할 수 있어요.</div></div>';
    }
    h += '<div class="sec"><h2>타관 상호대차 대기</h2><span class="n">' + mo.length + '</span>' +
      '<span class="hint">비치중 되면 신청</span></div>';
    h += mo.length ? '<div class="grid3">' + simpleRows(mo, true) + '</div>' : '<div class="empty">표시할 항목이 없습니다</div>';
    h += '<div class="sec"><h2>곧 나오는 신간</h2><span class="n">' + up.length + '</span>' +
      '<span class="hint">출간일 순</span></div>';
    h += up.length ? '<div class="grid3">' + simpleRows(up, true) + '</div>' : '<div class="empty">표시할 항목이 없습니다</div>';
    return h;
  }
  function noticeSection(){
    var h = '<div class="sec"><h2>이번 주 도서관 안내</h2></div>';
    if(DATA.todoNoteHtml) h += '<div class="callout"><span class="ic">🗓️</span><div>' + DATA.todoNoteHtml + '</div></div>';
    h += '<div class="callout"><span class="ic">💡</span><div>' +
      '위례(수령도서관) 소장 책은 상호대차가 안 됩니다. <b>비치중이면 바로 대출</b>, <b>대출중이면 예약</b>이 규칙이에요. ' +
      '타관에만 있으면 <b>비치중이 될 때까지</b> 지켜보다가 신청합니다.</div></div>';
    h += '<div class="sertools" style="margin-top:0.6rem">' +
      '<button class="sbtn" data-gotab="rules">📋 도서관 규칙 · 자동 점검 보기</button></div>';
    return h;
  }

  /* ---------------- 홈 ---------------- */
  function renderTodo(){
    var h = '';
    h += '<div class="sec"><h2>' + (state.by === 'who' ? '사람별 현황' : '도서관별 현황') + '</h2>' +
      '<span class="hint">' + esc(DATA.asOf) + ' 기준</span></div>';
    h += segHtml();
    h += summaryCard();
    h += '<div class="grid3">' + ((state.by === 'who') ? personCards() : libCards()) + '</div>';
    h += quickTiles();
    h += weekSection();
    h += holdSection();
    h += monitorSection();
    h += noticeSection();
    return h;
  }

  /* ---------------- 대출·예약 탭 ---------------- */
  function renderFilters(){
    var libs = ['전체'].concat((DATA.libs || []).map(function(x){ return x.lib; }));
    var whos = ['전체'].concat(whoList());
    var h = '<div class="filters" id="loansTop">';
    h += '<div class="frow">' + libs.map(function(l){
      return '<button class="chipbtn' + (state.lib === l ? ' on' : '') + '" data-lib="' + l + '">' + l + '</button>';
    }).join('') + '</div>';
    h += '<div class="frow" style="margin-top:0.3rem">' + whos.map(function(w){
      return '<button class="chipbtn' + (state.who === w ? ' on' : '') + '" data-who="' + w + '">' + w + '</button>';
    }).join('') + '</div>';
    var kinds = [{k:'all', l:'전체'}, {k:'loan', l:'대출중'}, {k:'reserve', l:'예약'}, {k:'hold', l:'상호대차'}, {k:'pickup', l:'수령 대기'}, {k:'overdue', l:'연체'}];
    h += '<div class="frow" style="margin-top:0.3rem">' + kinds.map(function(x){
      return '<button class="chipbtn' + (state.loanKind === x.k ? ' on' : '') + '" data-lkind="' + x.k + '">' + x.l + '</button>';
    }).join('') + '</div>';
    h += '</div>';
    return h;
  }
  function match(x){
    if(state.lib !== '전체' && String(x.lib).indexOf(state.lib.replace('위례','')) < 0) return false;
    if(state.who !== '전체' && x.who !== state.who) return false;
    return true;
  }
  var LIB_ORDER = {'성남위례':0, '하남위례':1, '위례래미안':2};
  function renderLoans(){
    var loans = DATA.loans.slice().sort(function(a,b){ return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0); }).filter(match);
    var res = DATA.reserves.slice().sort(function(a,b){
      var la = LIB_ORDER[a.lib] == null ? 9 : LIB_ORDER[a.lib], lb = LIB_ORDER[b.lib] == null ? 9 : LIB_ORDER[b.lib];
      if(la !== lb) return la - lb;
      return (a.rank || 9) - (b.rank || 9);
    }).filter(match);
    var holds = DATA.holds.filter(match);
    var lk = state.loanKind || 'all';

    var h = renderFilters();
    if(lk === 'overdue'){
      var ov = loans.filter(function(l){ return days(l.due) < 0; });
      h += '<div class="sec" id="sec-overdue"><h2>연체</h2><span class="n">' + ov.length + '</span><span class="hint">반납예정일 경과</span></div>';
      h += ov.length ? '<div class="cardgrid">' + ov.map(function(l){

            '<span class="dday ' + ddayClass(n) + '">' + ddayLabel(n) + '</span>' +
            '<span class="tiny">' + mdw(l.due) + ' 반납</span>',

        );
      }).join('') + '</div>' : '<div class="empty">연체 중인 도서가 없습니다 🎉</div>';
    }
    if(lk === 'pickup'){
      var pick = pickupItems().filter(match);

        '<span class="hint">도착했어요 · 데스크에서 받기</span></div>';
      h += pick.length ? '<div class="cardgrid">' + pick.map(function(p){
        var un = untilOf(p);
        var top = libPill(p.lib) + '<span class="dday ' + (un ? ddayClass(days(un)) : 'warn') + '">' + esc(p.kind) + ' ' + esc(p.tag) + '</span>' +
          (un ? '<span class="tiny">' + mdw(un) + '까지</span>' : '<span class="tiny">만기 확인</span>');
        return rowCard(p.t, top, '<b>' + esc(p.who) + '</b>' + (p.note ? ' · ' + noteHtml(p.note) : ''));
      }).join('') + '</div>' : '<div class="empty">지금 수령 대기 중인 책이 없습니다</div>';
    }
    if(lk === 'all' || lk === 'loan'){
      h += '<div class="sec" id="sec-loan"><h2>대출 중</h2><span class="n">' + loans.length + '</span><span class="hint">반납예정일 순</span></div>';
      h += loans.length ? '<div class="cardgrid">' + loans.map(function(l){
        var n = days(l.due);
        return rowCard(
          l.t,
          libPill(l.lib) +
            '<span class="dday ' + ddayClass(n) + '">' + ddayLabel(n) + '</span>' +
            '<span class="tiny">' + mdw(l.due) + ' 반납</span>',
          '<b>' + esc(l.who) + '</b>' + (l.note ? ' · ' + noteHtml(l.note) : '')
        );
      }).join('') + '</div>' : '<div class="empty">해당 조건의 대출이 없습니다</div>';
    }
    if(lk === 'all' || lk === 'reserve'){
      h += '<div class="sec" id="sec-reserve"><h2>예약</h2><span class="n">' + res.length + '</span><span class="hint">1순위가 가장 빠름</span></div>';
      h += res.length ? '<div class="cardgrid">' + res.map(function(r){
        var extra = [];
        if(r.since) extra.push(md(r.since) + ' 신청');
        if(untilOf(r)) extra.push('예약만기 ' + md(untilOf(r)));
        var top = libPill(r.lib) + '<span class="dday ok">' + r.rank + '순위</span>';
        if(r.arrived) top += '<span class="dday hot">도착</span>';
        return rowCard(
          r.t,
          top,
          '<b>' + esc(r.who) + '</b>' + (extra.length ? ' · ' + esc(extra.join(' · ')) : ''),
          r.note || ''
        );
      }).join('') + '</div>' : '<div class="empty">해당 조건의 예약이 없습니다</div>';
    }
    if(lk === 'all' || lk === 'hold'){
      h += '<div class="sec" id="sec-hold"><h2>상호대차</h2><span class="n">' + holds.length + '</span><span class="hint">도착 문자 후 3일 내 대출</span></div>';
      h += holds.length ? '<div class="cardgrid">' + holds.map(function(x){
        return rowCard(
          x.t,
          libPill(x.lib) + '<span class="dday warn">' + esc(x.status) + '</span>',
          '<b>' + esc(x.who) + '</b> · ' + esc(x.from) + ' → ' + esc(x.to),

  function seriesFiltered(){
    var q = state.q.replace(/\s+/g, '').toLowerCase();
    var src = seriesSource();
    if(state.sfilter === '제외됨'){
      return excluded.filter(function(n){
        return !q || normName(n).indexOf(q) >= 0;
      }).map(function(n){
        return findSeries(n) || {name:n, todoOnly:true, status:'할 일 항목', max:0, n:0, vols:[], gaps:[], last:'', loans:0};
      });
    }
    var res = src.filter(function(s){
      if(isExcluded(s.name)) return false;
      if(q && s.name.replace(/\s+/g,'').toLowerCase().indexOf(q) < 0) return false;
      if(state.sfilter === '이빠진 권수') return (s.gaps && s.gaps.length) || s.gapNote;
      if(state.sfilter === '신간 대기') return s.status === '신간대기';
      if(state.sfilter === '완간') return s.status === '완간';
      if(state.sfilter === '2026 활동') return s.last >= '2026-01';
      return true;
    });
    if(state.sfilter === '신간 대기'){
      var pickDate = function(s){
        var txt = (s.next || '') + ' ' + (s.note || '');
        var m = txt.match(/(\d{1,2})\/(\d{1,2})/);
        if(!m) return '99-99';
        var mm = ('0' + m[1]).slice(-2), dd = ('0' + m[2]).slice(-2);
        return mm + '-' + dd;
      };
      res = res.slice().sort(function(a,b){
        var da = pickDate(a), db = pickDate(b);
        return da < db ? -1 : (da > db ? 1 : 0);
      });
    }
    return res;
  }
